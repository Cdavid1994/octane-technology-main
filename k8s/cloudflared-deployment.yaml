# In-cluster cloudflared connector — this is what production actually runs.
#
# Hardening notes (see also k8s/cloudflared-networkpolicy.yaml):
# - ingress below has exactly one hostname -> one internal Service, with an
#   explicit `http_status:404` catch-all for anything else the tunnel is
#   asked to route. Nothing reaches this cluster through the tunnel except
#   octane.technology -> octane-site:80.
# - automountServiceAccountToken is disabled: cloudflared only makes one
#   outbound HTTP call to a hardcoded internal DNS name, it never talks to
#   the Kubernetes API, so it has no business holding a token that could.
# - image is pinned to a specific version, not `:latest`, so a redeploy
#   can't silently pull a different cloudflared build.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
data:
  config.yml: |
    tunnel: f4f6e8c8-ce9e-420f-8b0d-9290f43e2864
    credentials-file: /etc/cloudflared/creds/credentials.json
    ingress:
      - hostname: octane.technology
        service: http://octane-site.default.svc.cluster.local:80
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yml
            - run
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: cloudflared-credentials
        - name: tmp
          emptyDir: {}

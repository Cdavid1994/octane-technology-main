apiVersion: apps/v1
kind: Deployment
metadata:
  name: octane-site
  labels:
    app: octane-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: octane-site
  template:
    metadata:
      labels:
        app: octane-site
    spec:
      containers:
        - name: octane-site
          image: octane-site:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
